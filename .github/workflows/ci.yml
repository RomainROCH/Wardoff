name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: target

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
        rust:
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache Cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Full local checks
        shell: pwsh
        run: .\scripts\check.ps1 -Mode Full

      - name: Developer tooling tests
        shell: pwsh
        run: .\tests\developer_checks.ps1

      - name: Smoke safety tests
        shell: pwsh
        run: .\tests\smoke_safety.ps1

      - name: Release guard tests
        shell: pwsh
        run: .\tests\release_guards.ps1

      - name: Smoke tests
        shell: pwsh
        run: |
          $before = (Get-FileHash target/release/wardoff.exe -Algorithm SHA256).Hash
          .\tests\smoke_test.ps1 -UseExistingBinary
          if ($LASTEXITCODE -ne 0) { throw 'Smoke failed.' }
          if ((Get-FileHash target/release/wardoff.exe -Algorithm SHA256).Hash -ne $before) {
            throw 'Smoke changed the checked binary.'
          }

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: wardoff-windows-release
          path: target/release/wardoff.exe
          if-no-files-found: error
          retention-days: 7
