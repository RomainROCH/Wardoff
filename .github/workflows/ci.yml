name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: target

jobs:
  # Preserve this job id and matrix: Safe alone must not satisfy the old ci check.
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - windows-latest
        rust:
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache Cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Safe validation (native PowerRequest and system smoke excluded)
        id: safe
        shell: pwsh
        run: ./scripts/validate-safe.ps1 -OutputDirectory "$env:RUNNER_TEMP/WardoffSafe"

      - name: Retain Safe evidence (not a qualified release)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wardoff-safe-${{ github.sha }}
          path: ${{ runner.temp }}/WardoffSafe
          if-no-files-found: error

      - name: Required Full qualification (blocked while required evidence is missing)
        if: ${{ always() }}
        shell: pwsh
        env:
          SAFE_CONCLUSION: ${{ steps.safe.outcome || 'not_run' }}
        run: ./scripts/assert-qualification.ps1 -Scope Integration -SafeConclusion "$env:SAFE_CONCLUSION"
