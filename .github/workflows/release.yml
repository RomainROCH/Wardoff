name: Release

on:
  push:
    tags:
      - "v*"

# Qualification preparation only. No writer or publication command is enabled.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact tag source without write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Required release qualification (no publication)
        if: ${{ always() }}
        shell: pwsh
        run: ./scripts/assert-qualification.ps1 -Scope Release -SafeConclusion not_run
