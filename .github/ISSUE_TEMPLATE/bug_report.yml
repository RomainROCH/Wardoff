name: Bug report
description: Report a reproducible Wardoff bug with the runtime details needed to investigate it.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please keep this report focused on a reproducible Wardoff problem. For general questions or broader discussion, use GitHub Discussions.
  - type: input
    id: windows_version
    attributes:
      label: Windows version and edition
      description: Include the version, edition, and release if you know it.
      placeholder: e.g. Windows 11 Pro 23H2
    validations:
      required: true
  - type: dropdown
    id: session_privilege
    attributes:
      label: Session privilege
      description: Was Wardoff running from an administrator or non-administrator session?
      options:
        - Administrator session
        - Non-administrator session
    validations:
      required: true
  - type: input
    id: machine_type
    attributes:
      label: Machine type
      description: Optional. Tell us whether this happened on a physical machine or a VM.
      placeholder: e.g. Physical machine, Hyper-V VM, VMware VM
    validations:
      required: false
  - type: textarea
    id: command_or_action
    attributes:
      label: Exact Wardoff command or tray action used
      description: Include the exact CLI command, tray menu action, or launch path you used.
      placeholder: e.g. wardoff --block --hide
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Optional. List the shortest set of steps that reproduces the problem.
      placeholder: |
        1. Start Wardoff
        2. Run ...
        3. Observe ...
    validations:
      required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: status_output
    attributes:
      label: wardoff --status output
      description: Paste the exact output from `wardoff --status`.
      render: json
    validations:
      required: true
  - type: textarea
    id: log_lines
    attributes:
      label: Relevant JSONL log lines (last 5-10 lines)
      description: Paste the last 5-10 relevant lines from Wardoff's JSONL logs.
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Add screenshots if they help explain the problem.
    validations:
      required: false
