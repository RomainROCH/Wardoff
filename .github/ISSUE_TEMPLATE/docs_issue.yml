name: Documentation issue
description: Report confusing, incomplete, or incorrect Wardoff documentation.
title: "[Docs] "
labels:
  - documentation
body:
  - type: textarea
    id: doc_section
    attributes:
      label: Which document or section is confusing or wrong?
      description: Include the file name, heading, or link when possible.
    validations:
      required: true
  - type: textarea
    id: expected_information
    attributes:
      label: What did you expect to find?
    validations:
      required: true
  - type: textarea
    id: actual_information
    attributes:
      label: What did you actually find?
    validations:
      required: true
